.top .spacer{flex:1}
.search{position:relative;flex:1;max-width:440px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:40px;color:var(--ink-2)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;padding:9px 0;color:var(--ink)}
.search:focus-within{border-color:var(--brand)}
.sres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(43,33,26,.2);padding:6px;z-index:55;display:flex;flex-direction:column}
.sres[hidden]{display:none}
.sres button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;display:flex;flex-direction:column}
.sres button:hover{background:var(--brand-soft)}
.userchip{display:flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:10px;padding:4px 6px;font-weight:600;color:var(--ink)}
.userchip:hover{background:var(--mute-soft)}
.userchip .avatar{width:32px;height:32px;font-size:14px}
@media (max-width:859px){.top .t{display:block}.search,.top .spacer{display:none}}
@media (max-width:699px){.userchip .un,.userchip>svg{display:none}}
.foot{text-align:center;color:var(--ink-2);font-family:var(--f-display);font-style:italic;font-size:16px;padding-top:10px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat2{display:flex;gap:14px;align-items:center}
.stat2 .ico{width:46px;height:46px;border-radius:12px}
.stat2 .l{font-size:12px;color:var(--ink-2);font-weight:600}
.stat2 .v{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.1}
.dash2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:859px){.dash2{grid-template-columns:minmax(0,1fr)}}
.cb3,.cb5,.cb6,.cb8{color:var(--ink)}
.cb3{background:var(--c3-f);border:1px solid var(--c3-b)} .cb5{background:var(--c5-f);border:1px solid var(--c5-b)}
.cb6{background:var(--c6-f);border:1px solid var(--c6-b)} .cb8{background:var(--c8-f);border:1px solid var(--c8-b)}
.matgrid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){.matgrid{grid-template-columns:minmax(0,1fr)}}
.folder{width:38px;height:38px;border-radius:10px;background:var(--c5-f);color:var(--amber);display:grid;place-items:center;flex:none;border:1px solid var(--c5-b)}
.ring .c b{font-size:28px}

.auth::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(21,15,11,.5) 0%,rgba(21,15,11,.3) 40%,rgba(21,15,11,.88) 100%)}

.auth .logo{padding:0;color:#F5F0EB}
.auth .card{margin:auto 0;width:min(400px,100%);background:rgba(252,249,245,.97);color:#2B211A;border:0;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.auth .card h2{font-size:26px;font-weight:600}
.auth .card .sub{margin:-8px 0 0;color:#766454;font-size:13px}
.auth .tagl{font-family:var(--f-display);font-style:italic;font-size:22px;line-height:1.25;color:#EADBC8;margin:0}
.auth .field label{color:#766454}
.auth .inp{background:#fff;color:#2B211A;border-color:#D9CDBF}
.auth .inp svg{color:#8C7A6B}
.auth .inp:focus-within{border-color:#6B2D2A;box-shadow:0 0 0 3px #F1E1DA}
.auth .icon-btn:hover{background:#F1E8DF}
.auth .link{color:#6B2D2A}
.auth .btn{background:#6B2D2A;color:#fff}
.auth .demo{font-size:12px;color:#766454;background:#F1E8DF;border-radius:8px;padding:8px 10px}
.auth-side{display:none;position:relative;isolation:isolate;overflow:hidden}
@media (min-width:900px){
  .auth{grid-template-columns:var(--lw) minmax(0,1fr)}
  .auth::before{right:auto;width:var(--lw);background-position:center}
  .auth::after{right:auto;width:var(--lw);background:linear-gradient(180deg,rgba(21,15,11,.55) 0%,rgba(21,15,11,.12) 45%,rgba(21,15,11,.85) 100%)}
  .auth-side{display:flex;align-items:center;padding:48px max(32px,env(safe-area-inset-right,0px)) 48px 64px}
  .auth-side::before{content:"";position:absolute;inset:-60px;z-index:-1;background:var(--photo) center/cover;filter:blur(30px) brightness(.3) saturate(1.1)}
}
.auth-copy{max-width:520px;display:flex;flex-direction:column;gap:22px}
.auth-copy .eyebrow{color:#C9A98C}
.auth-copy h2{font-size:clamp(32px,3.6vw,48px);line-height:1.1;font-weight:600;color:#F5F0EB}
.feats{list-style:none;margin:0;padding:0;display:grid;gap:14px}

<script>
let S={},IDS=[],TOTAL_CR=0,UNTIL={};
function build(){S={};IDS=[];UNTIL={};const per={};
  [...state.subjects].sort((a,b)=>a.sem-b.sem||a.id-b.id).forEach(x=>{per[x.sem]=(per[x.sem]||0)+1;
    S[x.id]={id:x.id,name:x.name,sem:x.sem,pre:(x.pre||[]).filter(p=>state.subjects.some(y=>y.id===p)),cr:x.cr,dif:x.dif,code:'S'+x.sem+'.'+per[x.sem],dep:[]};
    IDS.push(x.id);if(x.until)UNTIL[x.id]=x.until});
  IDS.forEach(i=>S[i].pre.forEach(p=>S[p].dep.push(i)));
  TOTAL_CR=IDS.reduce((a,i)=>a+S[i].cr,0)}
const MAXSEM=20;
const canDelSem=()=>state.nsem>1&&state.currentSem<state.nsem&&!state.subjects.some(x=>x.sem===state.nsem)&&!state.classes.some(c=>c.sem===state.nsem);
const SEMS=()=>Array.from({length:state.nsem},(_,i)=>i+1);
const emptyPg=t=>`<div class="head"><div><h1>${t}</h1></div></div><div class="empty">Primeiro adicione as suas disciplinas.<br><button class="btn" style="margin-top:12px" data-act="nav" data-r="disciplinas">Ir para Disciplinas</button></div>`;

const MONTHS=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const DAYS=['Seg','Ter','Qua','Qui','Sex']; const DAYS_FULL=['Segunda','Terça','Quarta','Quinta','Sexta'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const addDays=n=>{const d=today();d.setDate(d.getDate()+n);return isoOf(d)};
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const daysUntil=s=>Math.round((parseD(s)-today())/864e5);
const fmtD=s=>{const d=parseD(s);return {d:pad(d.getDate()),m:MONTHS[d.getMonth()]}};
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const f1=n=>(Math.round(n*10)/10).toString().replace('.',',');
const STOP=new Set(['de','e','em','por','à','ao','do','da','dos','das','a','o']);
function abbr(n){const w=n.replace(/,/g,'').split(/\s+/);let rom='';if(/^(I|II|III|IV)$/.test(w[w.length-1]))rom=w.pop();
  const ini=w.filter(x=>!STOP.has(x.toLowerCase())).map(x=>x[0].toUpperCase()).join('');return (ini.length>3?ini.slice(0,3):ini)+(rom?' '+rom:'')}

/* Regras de notas e exames rigorosas */
function calcSubjectResult(id){
  const evs = evalsOf(id);
  const nt = e => (e.tipo||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const isRec = e => nt(e).includes('recorrenc'), isEx = e => nt(e).includes('exame') || isRec(e);
  const EPS = 1e-9;
  /* 1) avaliações de frequência: negativas e média ponderada */
  const freqEvs = evs.filter(e => !isEx(e) && e.nota != null);
  const pending = evs.some(e => !isEx(e) && e.nota == null);
  const totalFreqPeso = freqEvs.reduce((acc, e) => acc + e.peso, 0);
  const freqAvg = totalFreqPeso > 0 ? freqEvs.reduce((acc, e) => acc + e.nota * e.peso, 0) / totalFreqPeso : null;
  const hasNegativeFreq = freqEvs.some(e => e.nota < 10);
  const normalEx = evs.find(e => isEx(e) && !isRec(e) && e.nota != null);
  const recEx = evs.find(e => isRec(e) && e.nota != null);

  let finalGrade = null, situation = 'andamento', statusText = 'Em andamento', admitted = false;
  /* a situação só é decidida quando não há avaliações de frequência por lançar (ou os pesos já somam 100%) */
  const decided = freqAvg != null && (!pending || totalFreqPeso >= 100 - EPS);
  if (freqAvg != null && !decided) {
    statusText = 'Em andamento (faltam notas de frequência)';
  } else if (decided) {
    if (freqAvg < 10 - EPS) {
      /* a) EXCLUÍDO: média < 10, não vai a exame e repete a disciplina */
      situation = 'excluido';
      statusText = 'Excluído(a) por média (< 10): repete a disciplina';
    } else if (freqAvg >= 14 - EPS && !hasNegativeFreq) {
      /* c) DISPENSADO: média >= 14 e nenhuma avaliação negativa; nota final = média de frequência */
      situation = 'dispensado';
      finalGrade = freqAvg;
      statusText = 'Dispensado(a) por média (≥ 14, sem negativas)';
    } else {
      /* b) ADMITIDO ao exame normal: média entre 10 e 14, ou média >= 14 com alguma negativa */
      admitted = true;
      situation = 'admitido';
      statusText = freqAvg >= 14 - EPS ? 'Admitido(a) ao Exame Normal (média ≥ 14, mas tem negativa)' : 'Admitido(a) ao Exame Normal';
      if (normalEx) {
        const blended = (freqAvg + normalEx.nota) / 2;
        if (blended >= 10 - EPS) {
          finalGrade = blended; situation = 'aprovado';
          statusText = 'Aprovado(a) no Exame Normal';
        } else if (recEx) {
          finalGrade = recEx.nota;
          if (recEx.nota >= 10) { situation = 'aprovado'; statusText = 'Aprovado(a) na Recorrência'; }
          else { situation = 'reprovado'; statusText = 'Não Aprovado(a) na Recorrência'; }
        } else {
          situation = 'recorrencia';
          statusText = 'Reprovado(a) no Exame Normal: pode fazer o Exame de Recorrência';
        }
      }
    }
  }
  if (state.grades[id] != null) finalGrade = state.grades[id];
  return { freqAvg, finalGrade, statusText, situation, admitted, hasNegativeFreq };
}

function subjAvg(id){const res = calcSubjectResult(id); return res.finalGrade != null ? res.finalGrade : res.freqAvg;}

const W={credits:.15,diff:.20,grade:.20,prox:.25,content:.15,prec:.05};
const FLAB={credits:'Créditos',diff:'Dificuldade',grade:'Notas actuais',prox:'Avaliação próxima',content:'Por dominar',prec:'Precedências'};
function priority(id){
  const s=S[id],a=subjAvg(id),ne=nextEval(id);
  const f={credits:s.cr/6,diff:s.dif/5,grade:a==null?.5:clamp((17-a)/10,0,1),prox:0,content:1-(state.mastery[id]??50)/100,prec:Math.min(s.dep.length/3,1)};
  if(ne){const d=daysUntil(ne.data);f.prox=clamp(1-d/30,0,1)*(.6+.4*Math.min(ne.peso/40,1))}
  const score=Object.keys(W).reduce((t,k)=>t+W[k]*f[k],0);
  return {id,f,score,ne,avg:a};
}
const priorities=()=>state.enrolled.map(priority).sort((a,b)=>b.score-a.score);
function autoHours(){
  const P=priorities(),total=Math.max(P.length,state.weekly-1),sum=P.reduce((t,p)=>t+p.score,0)||1,out={};
  const raw=P.map(p=>({id:p.id,x:total*p.score/sum}));raw.forEach(r=>out[r.id]=Math.max(1,Math.floor(r.x)));
  let used=Object.values(out).reduce((a,b)=>a+b,0);const rem=[...raw].sort((a,b)=>(b.x%1)-(a.x%1));let i=0;
  while(used<total&&rem.length){out[rem[i%rem.length].id]++;used++;i++}
  while(used>total){const k=Object.keys(out).filter(k=>out[k]>1).sort((a,b)=>out[b]-out[a])[0];if(!k)break;out[k]--;used--}
  return out;
}
const hoursMap=()=>{const a=autoHours();return state.planMode==='manual'?Object.assign({},a,state.manual):a};

const cAB=c=>[Math.round((c.iniH??c.h)*60),Math.round((c.fimH??(c.h+c.n))*60)];
const aAB=a=>[Math.round(a.iniH*60),Math.round(a.fimH*60)];

function busyAt(d,h){
  const A=h*60,B=A+60;
  if(state.classes.some(c=>{const [a,b]=cAB(c);return c.sem===state.currentSem&&c.d===d&&a<B&&b>A}))return true;
  return state.activities.some(x=>{const [a,b]=aAB(x);return x.d===d&&a<B&&b>A});
}
function schedule(){
  const hm=hoursMap();const free=new Set();
  for(let d=0;d<5;d++)STUDY_H.forEach(h=>{if(!busyAt(d,h))free.add(d+'-'+h)});
  const freeTotal=free.size;const taken={};const load=[0,0,0,0,0];const cnt={};let unplaced=0;
  const order=priorities().map(p=>p.id);
  let rev=null;for(let d=4;d>=0&&!rev;d--)for(let k=STUDY_H.length-1;k>=0;k--){const h=STUDY_H[k];if(free.has(d+'-'+h)){rev={d,h};break}}
  if(rev){free.delete(rev.d+'-'+rev.h);taken[rev.d+'-'+rev.h]='rev';load[rev.d]++}
  order.forEach(id=>{
    const need=hm[id]||0;
    for(let k=0;k<need;k++){
      let best=null,bs=-1e9;
      free.forEach(key=>{
        const [d,h]=key.split('-').map(Number);const c=(cnt[id]||{})[d]||0;
        let sc=-c*2.6-load[d]*.7-(d*.01)-(h*.001);
        if(taken[d+'-'+(h-1)]===id||taken[d+'-'+(h+1)]===id)sc+=(c<2?4:-3);
        if(S[id].dif>=4&&h<12)sc+=.9;
        if(state.classes.some(x=>x.s===id&&x.d===d&&Math.floor(x.fimH||(x.h+x.n))===h))sc+=1.6;
        if(c>=3)sc-=6;
        if(sc>bs){bs=sc;best=[d,h,key]}
      });
      if(!best){unplaced++;continue}
      const [d,h,key]=best;free.delete(key);taken[key]=id;load[d]++;(cnt[id]=cnt[id]||{})[d]=((cnt[id]||{})[d]||0)+1;
    }
  });
  const blocks=[];
  for(let d=0;d<5;d++){let cur=null;
    for(let h=7;h<=18;h++){const t=taken[d+'-'+h];
      if(cur&&t===cur.s&&h===cur.h+cur.n){cur.n++;continue}
      cur=t?{s:t,d,h,n:1}:null;if(cur)blocks.push(cur)}}
  return {blocks,freeTotal,unplaced,hm,total:Object.values(hm).reduce((a,b)=>a+b,0)+(rev?1:0)};
}

}

const PT=(m,err)=>{const code=String((err&&err.code)||''),st=err&&err.status;m=(m||'').toLowerCase();
  if(code==='over_email_send_rate_limit'||m.includes('email rate limit'))return 'Há muitos pedidos de email neste momento (o servidor limita os envios). Aguarde alguns minutos e tente de novo.';
  if(code==='over_request_rate_limit'||st===429)return 'Há demasiados pedidos a partir desta ligação. Aguarde alguns minutos e tente de novo.';
  if(m.includes('invalid login'))return 'Email ou palavra-passe incorrectos.';
  if(m.includes('not confirmed'))return 'Confirme primeiro o seu email: abra o link que lhe enviámos.';
  if(m.includes('already registered'))return 'Já existe uma conta com este email. Entre ou recupere a palavra-passe.';
  if(m.includes('rate limit')||m.includes('too many')||m.includes('security purposes'))return 'Demasiados pedidos. Aguarde alguns minutos e tente de novo.';
  if(m.includes('at least'))return 'A palavra-passe é demasiado curta.';
  if(m.includes('different from the old')||m.includes('same password'))return 'A nova palavra-passe tem de ser diferente da actual.';
  if(m.includes('fetch')||m.includes('network'))return 'Sem ligação ao servidor. Verifique a internet.';
  return 'Não foi possível concluir. Tente novamente.'};

async function doAuth(){
  const a=ui.auth;if(a.busy)return;const email=(a.email||'').trim().toLowerCase(),m=a.mode;a.err='';
  if(m!=='newpw'&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){a.err='Indique um email válido.';return render()}
  if(m!=='reset'){if(m==='login'){if(!a.pw){a.err='Indique a palavra-passe.';return render()}}else if((a.pw||'').length<8){a.err='A palavra-passe deve ter pelo menos 8 caracteres.';return render()}}
  if((m==='signup'||m==='newpw')&&a.pw!==a.pw2){a.err='As palavras-passe não coincidem.';return render()}
  a.busy=true;render();
  try{
    if(m==='login'){const {error}=await sb.auth.signInWithPassword({email,password:a.pw});if(error){a.err=PT(error.message,error);a.needConfirm=/not confirmed/i.test(error.message)}else a.needConfirm=false}
    else if(m==='signup'){const {data,error}=await sb.auth.signUp({email,password:a.pw,options:{emailRedirectTo:redirectUrl()}});
      if(error)a.err=PT(error.message,error);
      else if(data.user&&data.user.identities&&data.user.identities.length===0)a.err='Já existe uma conta com este email. Entre ou recupere a palavra-passe.';
      else if(!data.session){a.mode='notice';a.notice='Enviámos um email de confirmação para '+email+'. Abra o link para activar a conta e depois entre. Veja também a pasta de spam.'}}
    else if(m==='reset'){const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:redirectUrl()});
      if(error&&/rate|many|security/i.test(error.message))a.err=PT(error.message,error);else{a.mode='notice';a.notice='Se existir uma conta com '+email+', enviámos-lhe um link para criar uma nova palavra-passe.'}}
    else if(m==='newpw'){const {error}=await sb.auth.updateUser({password:a.pw});if(error)a.err=PT(error.message,error);else{a.mode='login';toast('Palavra-passe actualizada.');try{history.replaceState(null,'',redirectUrl())}catch(e){}}}
  }catch(e){a.err=PT(e&&e.message,e)}
  a.busy=false;a.pw=a.pw2='';if(a.err&&/Aguarde alguns minutos/.test(a.err))coolDown(60);render();
}
function coolDown(sec){ui.auth.until=Date.now()+sec*1000;clearInterval(coolDown.t);coolDown.t=setInterval(()=>{const left=Math.ceil((ui.auth.until-Date.now())/1000),b=document.querySelector('form[data-form="auth"] button[type=submit]');if(left<=0){clearInterval(coolDown.t);ui.auth.until=0;render();return}if(b){b.disabled=true;b.textContent='Tente de novo em '+left+' s'}},1000)}
async function resendConfirm(){const a=ui.auth,email=(a.email||'').trim().toLowerCase();if(!email)return;a.err='';try{const {error}=await sb.auth.resend({type:'signup',email,options:{emailRedirectTo:redirectUrl()}});if(error){a.err=PT(error.message,error);if(/Aguarde alguns minutos/.test(a.err))coolDown(60)}else{a.mode='notice';a.notice='Reenviámos o email de confirmação para '+email+'. Veja também a pasta de spam.'}}catch(e){a.err=PT(e&&e.message,e)}render()}
async function changePw(){

function matchFilter(id){

const NODEC={done:['var(--ok)','var(--ok-soft)','var(--ok)'],now:['var(--amber)','var(--amber-soft)','var(--amber)'],open:['var(--blue)','var(--blue-soft)','var(--blue)'],locked:['var(--line-2)','var(--mute-soft)','var(--mute)'],failed:['var(--red)','var(--red-soft)','var(--red)']};
function wrap2(t,max=21){const w=t.split(' ');const L=[''];w.forEach(x=>{if((L[L.length-1]+' '+x).trim().length<=max)L[L.length-1]=(L[L.length-1]+' '+x).trim();else L.push(x)});
  if(L.length>2){L.length=2;L[1]=L[1].slice(0,max-1)+'…'}return L}
function graph(){
  const W_=164,H_=44,CX=58,RY=56,PX=16,PT=46,cols=state.nsem;
  const pos={},rowc={};IDS.forEach(i=>{const s=S[i].sem;const r=rowc[s]||0;rowc[s]=r+1;pos[i]={x:PX+(s-1)*(W_+CX),y:PT+r*RY}});
  const width=PX*2+cols*W_+(cols-1)*CX,height=PT+Math.max(1,...SEMS().map(n=>IDS.filter(i=>S[i].sem===n).length))*RY+8;
  const sel=ui.sel,anc=sel?ancestors(sel):new Set(),des=sel?descendants(sel):new Set();
  const inChain=i=>!sel||i===sel||anc.has(i)||des.has(i);
  let edges='';
  IDS.forEach(i=>S[i].pre.forEach(p=>{const a=pos[p],b=pos[i];const x1=a.x+W_,y1=a.y+H_/2,x2=b.x,y2=b.y+H_/2,dx=Math.max(30,(x2-x1)*.5);
    const hot=sel&&((i===sel||anc.has(i))&&(p===sel||anc.has(p)))||sel&&((p===sel||des.has(p))&&(i===sel||des.has(i)));
    const on=!sel||hot;const col=hot?(des.has(i)||i!==sel&&des.has(p)||p===sel?'var(--brand)':'var(--blue)'):'var(--line-2)';
    edges+=`<path d="M${x1} ${y1}C${x1+dx} ${y1} ${x2-dx} ${y2} ${x2} ${y2}" fill="none" stroke="${col}" stroke-width="${hot?2.2:1.3}" opacity="${on?(hot?1:.8):.12}"/>`}));
  const heads=[...Array(cols)].map((_,k)=>{const x=PX+k*(W_+CX);const cur=k+1===state.currentSem;
    return `${cur?`<rect x="${x-10}" y="4" width="${W_+20}" height="${height-8}" rx="12" fill="var(--brand-soft)" opacity=".55"/>`:''}<text x="${x+W_/2}" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="${cur?'var(--brand)':'var(--ink-2)'}" font-family="var(--f-display)">${k+1}º Semestre${cur?' · actual':''}</text>`}).join('');
  const nodes=IDS.map(i=>{const p=pos[i],c=ui.colorBy==='credits'?creditCol(S[i].cr):NODEC[status(i)],L=wrap2(S[i].name);const dim=!matchFilter(i)||!inChain(i);
    return `<g class="gnode" data-act="gsel" data-id="${i}" opacity="${dim?.22:1}" tabindex="0" role="button" aria-label="${esc(S[i].name)}, ${ST[status(i)].l}"><rect x="${p.x}" y="${p.y}" width="${W_}" height="${H_}" rx="9" fill="${c[1]}" stroke="${i===sel?'var(--ink)':c[0]}" stroke-width="${i===sel?2.6:1.4}" ${status(i)==='locked'?'stroke-dasharray="4 3"':''}/>
      <text x="${p.x+10}" y="${p.y+(L.length===1?H_/2+4:18)}" fill="var(--ink)">${esc(L[0])}</text>${L[1]?`<text x="${p.x+10}" y="${p.y+32}" fill="var(--ink)">${esc(L[1])}</text>`:''}
      ${UNTIL[i]?`<text x="${p.x+W_-8}" y="${p.y+12}" text-anchor="end" font-size="9" fill="var(--mute)" style="font-weight:700">até S${UNTIL[i]}</text>`:''}${ui.colorBy==='credits'?`<circle cx="${p.x+W_-11}" cy="${p.y+H_-10}" r="4.5" fill="${NODEC[status(i)][0]||'var(--brand)'}"/>`:''}</g>`}).join('');
  return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="group" aria-label="Mapa de precedências entre as disciplinas">${heads}${edges}${nodes}</svg>`;
}

      ${open?`<div class="stack" style="gap:6px">${Object.keys(W).map(k=>`<div class="fbar"><span>${FLAB[k]}</span><div class="bar"><i style="width:${p.f[k]*100}%"></i></div><span class="num">${Math.round(p.f[k]*100)}</span></div>`).join('')}<div class="muted small">Cada factor vale: ${Object.keys(W).map(k=>FLAB[k]+' '+Math.round(W[k]*100)+'%').join(' · ')}.</div></div>`:''}</div>`}).join('');

  <div class="card row between wrap"><div><div class="eyebrow">Tempo sugerido esta semana</div><div class="muted small">Horas de estudo autónomo por semana · ${sch.freeTotal} h livres no horário</div></div>

const toBlob=(cv,q=.85)=>new Promise(r=>cv.toBlob(r,'image/jpeg',q));
async function imgBlob(f,maxW=1800){const bm=await createImageBitmap(f),k=Math.min(1,maxW/bm.width),cv=document.createElement('canvas');cv.width=Math.round(bm.width*k);cv.height=Math.round(bm.height*k);const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(bm,0,0,cv.width,cv.height);return toBlob(cv)}
async function loadPdfjs(){
  if(globalThis.__pdfjsLib)return globalThis.__pdfjsLib;
  const bin=Uint8Array.from(atob(document.getElementById('pdfjs-gz').textContent.trim()),c=>c.charCodeAt(0));

function applyTheme(){const t=state.theme;const r=document.documentElement;if(t==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t)}
function render(){
  applyTheme();const root=document.getElementById('root');
  const y=window.scrollY;
  if(!CONFIGURED){root.innerHTML=pgNeedConfig();return}
  if(!ui.booted){root.innerHTML=pgLoading();return}
  if(ui.auth.mode==='newpw'){root.innerHTML=pgAuth();return}
  if(!SESSION){root.innerHTML=pgAuth();return}
  if(!state.setup){root.innerHTML=pgSetup();return}
  let modal='';
  if(ui.modal&&ui.modal.t==='subj')modal=subjSheet(ui.modal.id);else if(ui.modal&&ui.modal.t==='enrol')modal=enrolSheet();else if(ui.modal&&ui.modal.t==='sform')modal=sformSheet();
  root.innerHTML=shell(PAGES[ui.route]())+modal;
  window.scrollTo(0,y);
}
function go(r){ui.route=r;ui.drawer=false;ui.modal=null;ui.selectedFolder=null;render();window.scrollTo(0,0)}

const setPath=(path,val)=>{const k=path.split('.');let o=ui;while(k.length>1)o=o[k.shift()];o[k[0]]=val};
document.addEventListener('input',e=>{
  const m=e.target.dataset&&e.target.dataset.model;if(!m)return;
  let v=e.target.value;if(e.target.dataset.num||e.target.tagName==='SELECT'&&/^\d+$/.test(v))v=Number(v);
  if(m==='finalGrade'){ui.finalGrade=v;return}
  setPath(m,v);
  if(m==='setup.nsem'){
    const n = Number(v);
    const sel = document.getElementById('s-s');
    if(sel){
      sel.innerHTML = [...Array(n)].map((_,i)=>`<option value="${i+1}" ${i+1===Math.min(ui.setup.cur,n)?'selected':''}>${i+1}º semestre</option>`).join('');
    }
  }
  if(m==='courseSearch'||m==='matQ'){const pos=e.target.selectionStart,eid=e.target.id;render();const el=document.getElementById(eid);if(el){el.focus();el.setSelectionRange(pos,pos)}}
});
document.addEventListener('change',e=>{
  const el=e.target,m=el.dataset&&el.dataset.model;
  if(m&&el.tagName==='SELECT'){let v=el.value;if(/^\d+$/.test(v))v=Number(v);if(m!=='finalGrade')setPath(m,v);if(m==='setup.nsem'){ui.setup.cur=Math.min(ui.setup.cur,ui.setup.nsem)}}
  const c=el.dataset&&el.dataset.change;if(!c)return;
  const id=+el.dataset.id,k=+el.dataset.k;
  switch(c){
   case 'mat-subj':ui.matSubj=+el.value;ui.matCat='todos';ui.matAdd=false;ui.selectedFolder=null;render();break;
   case 'mat-file':ui.matFile=el.files[0]||null;render();break;
   case 'hor-sem':ui.horSem=+el.value;render();break;
   case 'show-study':ui.showStudy=el.checked;render();break;
   case 'cur-sem':mutate(()=>{state.currentSem=+el.value},'Semestre actual alterado');break;
   case 'import-subj':ui.upFile=el.files[0]||null;el.value='';if(ui.upFile)runUpload('disciplinas');break;
   case 'upload-schedule':ui.upFile=el.files[0]||null;el.value='';if(ui.upFile)runUpload('horario');break;
   case 'eval-nota':{const v=el.value===''?null:clamp(Number(el.value),0,20);const ev=state.evals.find(x=>x.id===id);mutate(()=>{ev.nota=v},v==null?'Nota removida':'Nota guardada');break}
   case 'eval-tipo':{const ev=state.evals.find(x=>x.id===id);mutate(()=>{ev.tipo=el.value},'Tipo alterado');break}
   case 'eval-peso':{const v=clamp(Number(el.value)||1,1,100);const ev=state.evals.find(x=>x.id===id);mutate(()=>{ev.peso=v},'Peso alterado');break}
   case 'eval-data':{const ev=state.evals.find(x=>x.id===id);if(el.value)mutate(()=>{ev.data=el.value},'Data alterada');break}
   case 'sf-pre':{const p=ui.sf.pre,ix=p.indexOf(id);if(el.checked&&ix<0)p.push(id);if(!el.checked&&ix>=0)p.splice(ix,1);break}
   case 'mastery':mutate(()=>{state.mastery[id]=+el.value},'Conteúdo dominado actualizado');break;
  }
});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.change==='mastery'){const o=document.getElementById('mv'+e.target.dataset.id);if(o)o.textContent=e.target.value+'%'}});
document.addEventListener('submit',e=>{
  if(e.target.dataset&&e.target.dataset.form==='auth'){e.preventDefault();doAuth();return}
  if(!e.target.dataset||e.target.dataset.form!=='setup')return;e.preventDefault();
  const u=ui.setup,full=(u.name||'').trim()||'Estudante';
  state.user.full=full;state.user.name=full.split(' ')[0];state.user.uni=(u.uni||'').trim();state.user.course=(u.course||'').trim();
  state.nsem=+u.nsem;state.currentSem=Math.min(+u.cur,+u.nsem);state.setup=true;ui.semTab=ui.horSem=state.currentSem;ui.route='disciplinas';
  save();render();toast('Curso criado. Adicione agora as suas disciplinas.');
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('gnode')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
  if(e.key==='Escape'&&ui.modal){ui.modal=null;render()}});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=+t.dataset.id;
  if(t.dataset.act==='close-modal'&&e.target!==t&&e.target.closest('.sheet')&&!e.target.closest('button[data-act="close-modal"]'))return;
  switch(a){
   case 'nav':go(t.dataset.r);break;
   case 'drawer':ui.drawer=!ui.drawer;render();break;
   case 'bell':toast('Sem notificações novas.');break;
   case 'sem-add':if(state.nsem>=MAXSEM){toast('O máximo é '+MAXSEM+' semestres.');break}state.nsem++;ui.semTab=state.nsem;save();render();toast('Semestre '+state.nsem+' adicionado.');break;
   case 'sem-del':if(!canDelSem())break;state.nsem--;if(ui.semTab>state.nsem)ui.semTab=state.nsem;if(ui.horSem>state.nsem)ui.horSem=state.nsem;save();render();break;
   case 'semtab':ui.semTab=+t.dataset.n;render();break;
   case 'subj':ui.modal={t:'subj',id};ui.finalGrade=undefined;render();break;
   case 'close-modal':ui.modal=null;render();break;
   case 'enrol-open':ui.modal={t:'enrol'};render();break;
   case 'enrol':mutate(()=>{if(!state.enrolled.includes(id))state.enrolled.push(id);if(state.grades[id]!=null&&state.grades[id]<10)delete state.grades[id]},S[id].name+' · inscrito');if(!t.dataset.stay){ui.modal=null;render()}else{ui.modal={t:'enrol'};render()}break;
   case 'unenrol':mutate(()=>{state.enrolled=state.enrolled.filter(x=>x!==id)},'Inscrição removida');ui.modal={t:'subj',id};render();break;
   case 'save-grade':{const v=ui.finalGrade!==undefined?ui.finalGrade:document.getElementById('fg').value;if(v===''||isNaN(Number(v))||v<0||v>20){toast('Indique uma nota entre 0 e 20.');break}
     mutate(()=>{state.grades[id]=Math.round(Number(v));if(state.grades[id]>=10)state.enrolled=state.enrolled.filter(x=>x!==id)},Number(v)>=10?'Aprovado a '+S[id].name:'Nota guardada · disciplina pendente');
     ui.modal=null;render();break}
   case 'goto-mat':ui.matSubj=id;ui.matCat='todos';ui.selectedFolder=null;go('materiais');break;
   case 'gsel':ui.sel=ui.sel===id?null:id;render();break;
   case 'gclear':ui.sel=null;render();break;
   case 'view':ui.view=t.dataset.v;render();break;
   case 'colorby':ui.colorBy=t.dataset.v;render();break;
   case 'filter':ui.filter=t.dataset.k;render();break;
   case 'open-folder':ui.selectedFolder=t.dataset.k;render();break;
   case 'close-folder':ui.selectedFolder=null;render();break;
   case 'matcat':ui.matCat=t.dataset.k;render();break;
   case 'mat-add':ui.matAdd=true;ui.matFile=null;ui.matNewCat='aulas';render();break;
   case 'mat-cancel':ui.matAdd=false;render();break;
   case 'mat-save':{const f=ui.matFile;if(!f)break;if(f.size>MAXF){toast('Ficheiro demasiado grande. O máximo é 3 MB.');break}
     const sid=ui.matSubj,cat=ui.matNewCat||'aulas',ex=(f.name.split('.').pop()||'').toUpperCase();const ext=['PDF','PPTX','DOCX','XLSX','ZIP'].includes(ex)?ex:(['PNG','JPG','JPEG'].includes(ex)?'IMG':'FILE');
     const sz=f.size>1048576?f1(f.size/1048576)+' MB':Math.max(1,Math.round(f.size/1024))+' KB',fid=uid();
     ui.matAdd=false;ui.matFile=null;toast('A guardar o ficheiro…');render();
     FileStore.put(fid,f).then(n=>{(state.materials[sid]=state.materials[sid]||[]).push({id:fid,name:f.name,ext,size:sz,cat,chunks:n,mime:f.type||''});save();render();toast('Material associado a '+S[sid].code)}).catch(()=>toast('Não foi possível guardar o ficheiro.'));break}
   case 'mat-del':{const m=(state.materials[ui.matSubj]||[]).find(x=>x.id===id);state.materials[ui.matSubj]=state.materials[ui.matSubj].filter(x=>x.id!==id);save();render();if(m)FileStore.del(id,m);break}
   case 'mat-dl':{const m=Object.values(state.materials).flat().find(x=>x.id===id);if(!m)break;
     FileStore.get(id,m).then(b=>{if(!b){toast('Este ficheiro foi registado sem conteúdo. Carregue-o novamente.');return}return saveBlob(m.name,b)}).catch(()=>toast('Não foi possível descarregar o ficheiro.'));break}
   case 'act-toggle':ui.actOpen=!ui.actOpen;ui.actForm={nome:'',d:0,ta:'16:00',tb:'17:00'};render();break;
   case 'act-edit':{const x=state.activities.find(y=>y.id===id);if(x){const [a,b]=aAB(x);ui.actForm={id:x.id,nome:x.nome,d:x.d,ta:fmtM(a),tb:fmtM(b)};ui.actOpen=true;render()}break}
   case 'act-save':{const f=ui.actForm,a=toMin(f.ta),b=toMin(f.tb);if(!f.nome.trim()){toast('Dê um nome à actividade.');break}
     if(a==null||b==null||b-a<10){toast('A hora de fim tem de ser depois da hora de início.');break}
     const days=f.d==='all'?[0,1,2,3,4]:[+f.d];
     const clash=state.classes.find(c=>{const [x,y]=cAB(c);return c.sem===state.currentSem&&days.includes(c.d)&&a<y&&b>x});if(clash){toast('Choca com a aula de '+S[clash.s].name+' ('+DAYS[clash.d]+').');break}
     mutate(()=>{if(f.id)Object.assign(state.activities.find(x=>x.id===f.id),{nome:f.nome.trim(),d:days[0],iniH:a/60,fimH:b/60});else days.forEach(d=>state.activities.push({id:uid(),nome:f.nome.trim(),d,iniH:a/60,fimH:b/60}))},'Actividade guardada');ui.actOpen=false;render();break}
   case 'act-del':mutate(()=>{state.activities=state.activities.filter(x=>x.id!==id)},'Actividade removida');ui.actOpen=false;render();break;
   case 'del-schedule-file':delete state.scheduleFiles[ui.horSem];save();render();toast('Ficheiro de horário removido.');break;
   case 'evtab':ui.evalTab=t.dataset.k;render();break;
   case 'eval-add':{const f=ui.evalForm;if(!f.tipo){toast('Crie primeiro um tipo de avaliação.');break}if(!f.data){toast('Escolha a data da avaliação.');break}const peso=Number(f.peso);if(!(peso>=1&&peso<=100)){toast('O peso deve estar entre 1 e 100.');break}
     const nota=f.nota===''?null:Number(f.nota);if(nota!=null&&(nota<0||nota>20)){toast('A nota deve estar entre 0 e 20.');break}
     mutate(()=>{state.evals.push({id:uid(),subj:+f.subj,tipo:f.tipo,nota,peso,data:f.data})},'Avaliação adicionada');ui.evalForm.nota='';break}
   case 'eval-del':mutate(()=>{state.evals=state.evals.filter(x=>x.id!==id)},'Avaliação removida');break;
   case 'use-avg':{const res=calcSubjectResult(id);if(res.finalGrade==null)break;const v=Math.round(res.finalGrade*10)/10;mutate(()=>{state.grades[id]=v;if(v>=10)state.enrolled=state.enrolled.filter(x=>x!==id)},'Nota final de '+S[id].name+': '+f1(v));break}
   case 'ntab':ui.notasTab=t.dataset.k;render();break;
   case 'pmode':mutate(()=>{state.planMode=t.dataset.k;if(state.planMode==='manual')state.manual=Object.assign({},autoHours())},'Modo '+(t.dataset.k==='auto'?'automático':'manual'));break;
   case 'weekly':mutate(()=>{state.weekly=clamp(state.weekly+Number(t.dataset.d),state.enrolled.length+1,40);if(state.planMode==='manual')state.manual=Object.assign({},autoHours())},'Carga semanal: '+clamp(state.weekly+Number(t.dataset.d),0,40)+'h');break;
   case 'man':mutate(()=>{state.manual[id]=clamp((hoursMap()[id]||0)+Number(t.dataset.d),0,12)},'Horas ajustadas');break;
   case 'why':ui.why[id]=!ui.why[id];render();break;
   case 'plan-full':ui.planFull=!ui.planFull;render();break;
   case 'to-hor':ui.horSem=state.currentSem;ui.showStudy=true;go('horario');break;
   case 'theme':state.theme=t.dataset.k;save();render();break;
   case 'sform':{const x=S[id];ui.sf=x?{id,name:x.name,sem:x.sem,cr:x.cr,dif:x.dif,until:UNTIL[id]||'',pre:[...x.pre]}:{id:null,name:'',sem:ui.semTab,cr:4,dif:3,until:'',pre:[]};ui.modal={t:'sform'};render();break}
   case 'sf-save':{const f=ui.sf,nm=(f.name||'').trim();if(!nm){toast('Dê um nome à disciplina.');break}const cr=Number(f.cr);if(!(cr>=1&&cr<=30)){toast('Os créditos devem estar entre 1 e 30.');break}
     mutate(()=>{const rec={name:nm,sem:+f.sem,cr,dif:+f.dif,until:f.until?+f.until:0,pre:[...f.pre]};if(f.id)Object.assign(state.subjects.find(x=>x.id===f.id),rec);else state.subjects.push(Object.assign({id:uid()},rec))},'Disciplina guardada');ui.semTab=+f.sem;ui.modal=null;render();break}
   case 'sdel':{const x=S[id];if(!x)break;if(ui.delConf!==id){ui.delConf=id;toast('Toque outra vez para eliminar “'+x.name+'”.');break}ui.delConf=null;
     mutate(()=>{state.subjects=state.subjects.filter(y=>y.id!==id);state.subjects.forEach(y=>{y.pre=(y.pre||[]).filter(p=>p!==id)});delete state.grades[id];delete state.materials[id];delete state.mastery[id];state.enrolled=state.enrolled.filter(x=>x!==id);state.evals=state.evals.filter(e=>e.subj!==id);state.classes=state.classes.filter(c=>c.s!==id)},'Disciplina eliminada');ui.modal=null;render();break}
   case 'cls-add':{const subs=IDS.filter(i=>S[i].sem===ui.horSem),o=subs.length?subs:IDS;ui.cf={id:null,s:o[0],d:0,ta:'08:00',tb:'09:30',t:'T',r:''};render();break}
   case 'cls-edit':{const c=state.classes.find(x=>x.id===id);if(c){const [a,b]=cAB(c);ui.cf={id:c.id,s:c.s,d:c.d,ta:fmtM(a),tb:fmtM(b),t:c.t,r:c.r==='—'?'':c.r};render()}break}
   case 'cls-cancel':ui.cf=null;render();break;
   case 'cls-del':{const cid=ui.cf.id;mutate(()=>{state.classes=state.classes.filter(x=>x.id!==cid)},'Aula eliminada');ui.cf=null;render();break}
   case 'cls-save':{const f=ui.cf,d=+f.d,a=toMin(f.ta),b=toMin(f.tb);if(!S[f.s]){toast('Escolha a disciplina.');break}if(a==null||b==null){toast('Indique a hora de início e de fim.');break}if(b-a<10){toast('A hora de fim tem de ser posterior à hora de início.');break}
     const clash=state.classes.find(c=>{const [x,y]=cAB(c);return c.id!==f.id&&c.sem===ui.horSem&&c.d===d&&a<y&&b>x});if(clash){toast('Choca com a aula de '+S[clash.s].name+'.');break}
     if(ui.horSem===state.currentSem){const ac=state.activities.find(x=>{const [p,q]=aAB(x);return x.d===d&&a<q&&b>p});if(ac){toast('Choca com a actividade “'+ac.nome+'”.');break}}
     const rec={sem:ui.horSem,s:+f.s,d,iniH:a/60,fimH:b/60,h:Math.floor(a/60),n:Math.max(1,Math.ceil((b-a)/60)),t:f.t,r:(f.r||'').trim()||'—'};
     mutate(()=>{if(f.id)Object.assign(state.classes.find(x=>x.id===f.id),rec);else state.classes.push(Object.assign({id:uid()},rec))},'Aula guardada');ui.cf=null;render();break}
   case 'type-add':{const v=(ui.newType||'').trim();if(!v)break;if(state.evalTypes.some(x=>x.toLowerCase()===v.toLowerCase())){toast('Esse tipo já existe.');break}state.evalTypes.push(v);ui.newType='';save();render();break}
   case 'type-del':state.evalTypes=state.evalTypes.filter(x=>x!==t.dataset.t);save();render();break;
   case 'prof-save':{const p=ui.prof;mutate(()=>{state.user.full=(p.name||'').trim()||state.user.full;state.user.name=state.user.full.split(' ')[0];state.user.uni=p.uni;state.user.course=p.course;state.nsem=Math.max(+p.nsem,state.currentSem,...state.subjects.map(x=>x.sem))},'Perfil guardado');ui.prof=null;render();break}
   case 'logout':logout();break;
   case 'resend':resendConfirm();break;
   case 'pw-change':changePw();break;
   case 'export':saveBlob('smartstudy-dados.json',new Blob([JSON.stringify(state,null,1)],{type:'application/json'}));break;
   case 'auth-mode':ui.auth.mode=t.dataset.k;ui.auth.err='';ui.auth.pw=ui.auth.pw2='';render();break;
   case 'up-rm':ui.up.items.splice(id,1);if(!ui.up.items.length)ui.up.items=null;render();break;
   case 'up-ai':runUpload(t.dataset.k,true);break;
   case 'up-cancel':ui.up.items=null;ui.upFile=null;ui.up.msg='';render();break;
   case 'up-ok':importItems(t.dataset.k);break;
   case 'wipe':if(!ui.wipe){ui.wipe=true;render();break}state=blank();state.user.email=SESSION;ui.wipe=false;ui.prof=null;ui.route='inicio';ui.setup={name:'',uni:'',course:'',nsem:8,cur:1};save();render();break;
  }
});
document.addEventListener('input',e=>{if(e.target.id!=='gs')return;const q=e.target.value.trim().toLowerCase(),b=document.getElementById('sres');if(!b)return;
  if(q.length<2){b.hidden=true;b.innerHTML='';return}
  const r=IDS.filter(i=>(S[i].name+' '+S[i].code).toLowerCase().includes(q)).slice(0,6);
  b.innerHTML=r.length?r.map(i=>`<button data-act="subj" data-id="${i}"><b>${esc(S[i].name)}</b><span class="muted small">${S[i].code} · ${S[i].sem}º semestre</span></button>`).join(''):'<div class="muted small" style="padding:10px">Sem resultados.</div>';b.hidden=false});
document.addEventListener('focusout',e=>{if(e.target.id==='gs')setTimeout(()=>{const b=document.getElementById('sres');if(b)b.hidden=true},200)});
(function boot(){
  const h=location.hash.slice(1);ui.evalForm.data=addDays(10);render();
  if(!CONFIGURED)return;
  fetch('/api/read').then(r=>r.ok?r.json():null).then(j=>{ui.aiOn=!!(j&&j.enabled);if(SESSION)render()}).catch(()=>{});
  if(!window.supabase){ui.booted=true;ui.auth.err='Não foi possível carregar o Supabase. Verifique a ligação à internet.';render();return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev,sess)=>{setTimeout(()=>onAuth(ev,sess),0)});
  document.addEventListener('visibilitychange',async()=>{
    if(!sb||!UID)return;
    if(document.visibilityState==='hidden'&&save.t){clearTimeout(save.t);pushState()}
    if(document.visibilityState==='visible'&&!save.t){
      try{const {data}=await sb.from('app_state').select('data,updated_at').eq('user_id',UID).maybeSingle();
        if(data&&data.updated_at&&data.updated_at!==ui.rev&&!save.t){state=migrate(data.data);state.user.email=SESSION;ui.rev=data.updated_at;build();render()}}catch(e){}}
  });
})();
</script>
